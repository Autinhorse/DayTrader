<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #131722;
               font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }
  #chart { position: absolute; inset: 0; }
  body.dw #chart { right: 220px; }
  #datawin { display: none; position: absolute; top: 0; right: 0; bottom: 0; width: 220px;
             box-sizing: border-box; padding: 8px 10px; overflow-y: auto; background: #181c27;
             border-left: 1px solid #2a2e39; color: #d1d4dc; font-size: 12px; line-height: 1.55; }
  body.dw #datawin { display: block; }
  .info .h { color: #9598a1; margin-top: 6px; border-top: 1px solid #2a2e39; padding-top: 4px;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info .h:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
  .info .r { display: flex; justify-content: space-between; gap: 8px; }
  .info .r .k { color: #9598a1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info .r .v { font-variant-numeric: tabular-nums; }
  .info .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .info .up { color: #26a69a; } .info .dn { color: #ef5350; }
  .info .m { color: #d1d4dc; white-space: normal; }
  #popup { display: none; position: absolute; z-index: 20; width: 240px; max-height: 80%;
           overflow-y: auto; box-sizing: border-box; padding: 8px 10px; background: #1e2230f0;
           border: 1px solid #434651; border-radius: 4px; color: #d1d4dc; font-size: 12px;
           line-height: 1.55; box-shadow: 0 4px 16px #000a; }
  #legend { position: absolute; left: 8px; top: 6px; z-index: 10; color: #d1d4dc; font-size: 12px;
            pointer-events: none; line-height: 1.5; max-width: calc(100% - 300px); }
  #legend .t { color: #9598a1; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           color: #787b86; font-size: 14px; }
</style>
<script src="lightweight-charts.standalone.production.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
<div id="chart"></div>
<div id="legend"></div>
<div id="empty">没有数据</div>
<div id="datawin" class="info"></div>
<div id="popup" class="info"></div>
<script src="chart.js"></script>
</body>
</html>
